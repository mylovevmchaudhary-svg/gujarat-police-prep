name: Build Flutter APK, AAB & Web Admin Portal

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK, AAB Bundle and Web Portal
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Initialize Android and Web Platforms
        run: |
          if [ ! -d "android" ]; then
            echo "Generating Android project scaffolding..."
            flutter create --platforms=android .
          fi
          if [ ! -d "web" ]; then
            echo "Generating Web project scaffolding..."
            flutter create --platforms=web .
          fi

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 📱 Build Release APK
        run: flutter build apk --release

      - name: 📦 Build Release AAB (App Bundle)
        run: flutter build appbundle --release

      - name: 🌐 Build Web Admin Portal
        run: flutter build web --release

      - name: 🚀 Upload APK Artifact (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: GujaratPolicePrep-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: 🚀 Upload AAB Bundle Artifact (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: GujaratPolicePrep-Release-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: 🚀 Upload Web Admin Portal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GujaratPolicePrep-Web-Admin-Portal
          path: build/web
          retention-days: 14
