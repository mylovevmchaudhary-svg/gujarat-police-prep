name: Build Flutter APK & AAB Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  build:
    name: Build Android APK and AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Initialize Android Scaffolding if needed
        run: |
          if [ ! -d "android" ]; then
            echo "Generating Android platform scaffolding..."
            flutter create --platforms=android .
          fi

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 📱 Build Release APK (For testing & direct install on phones)
        run: flutter build apk --release

      - name: 📦 Build Release AAB (App Bundle for Google Play Console)
        run: flutter build appbundle --release

      - name: 🚀 Upload APK Artifact (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: GujaratPolicePrep-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: 🚀 Upload AAB Bundle Artifact (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: GujaratPolicePrep-Release-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
