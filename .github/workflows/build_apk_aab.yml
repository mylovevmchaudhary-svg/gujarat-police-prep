name: Build Lean Student & Admin APKs (Zero-Storage Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PSI Mock Test Student & Admin Apps
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Initialize Clean Student App Scaffolding & Branded Icon
        run: |
          rm -rf android
          flutter create --platforms=android --org com.police.prep .
          # Copy custom Gujarat Police PSI Emblem launcher icons
          cp -rf android_branding/mipmap-* android/app/src/main/res/
          # Configure Student App Launcher Name to "PSI Mock Test"
          sed -i 's/android:label="[^"]*"/android:label="PSI Mock Test"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher_round"/g' android/app/src/main/AndroidManifest.xml

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Student App Dependencies
        run: flutter pub get

      - name: ⚡ Build PSI Mock Test Student Release APK (~16MB)
        run: |
          mkdir -p build/symbols
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/PSI_Mock_Test_Student_App.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Gujarat_Police_Student_App.apk

      - name: 📦 Build Release AAB (App Bundle for Play Store)
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/PSI_Mock_Test_Student_App.aab

      - name: 🎛️ Build Standalone Admin Release APK (~16MB)
        run: |
          cd police_admin_app
          flutter create --platforms=android --org com.police.admin .
          sed -i 's/android:label="[^"]*"/android:label="PSI Admin Console"/g' android/app/src/main/AndroidManifest.xml
          cp -rf ../android_branding/mipmap-* android/app/src/main/res/
          flutter pub get
          mkdir -p ../build/symbols
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=../build/symbols
          mkdir -p ../build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../build/app/outputs/flutter-apk/PSI_Mock_Test_Admin_App.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../build/app/outputs/flutter-apk/Gujarat_Police_Admin_App.apk
          cd ..

      - name: 🚀 Publish Direct GitHub Release (Zero-Storage - Does NOT consume Actions Quota)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v3.8.0-latest
          name: "PSI Mock Test & Admin Console v3.8.0 (Permanent Dynamic Supabase Sync - 200+ MCQs, Tests 1-100+, Live Syllabus)"
          body: |
            ## 👮‍♂️ PSI Mock Test (Gujarat Police Constable & PSI Edition) - v3.8.0
            
            ### 📥 Download Android Applications:
            - 📱 **Student Mobile App (~16MB):** [PSI_Mock_Test_Student_App.apk](https://github.com/${{ github.repository }}/releases/download/v3.8.0-latest/PSI_Mock_Test_Student_App.apk)
            - 🎛️ **Dedicated Admin App (~16MB):** [PSI_Mock_Test_Admin_App.apk](https://github.com/${{ github.repository }}/releases/download/v3.8.0-latest/PSI_Mock_Test_Admin_App.apk)
            - 📦 **Play Store AAB Bundle:** [PSI_Mock_Test_Student_App.aab](https://github.com/${{ github.repository }}/releases/download/v3.8.0-latest/PSI_Mock_Test_Student_App.aab)
            
            ### 🚀 What's New in v3.8.0 (Permanent Supabase Dynamic Sync):
            - 🧠 **Dynamic MCQ System (200 to 10,000+ MCQs):** Full paginated batch streaming from `mock_test_questions` joined with `questions`. Constable Mock Test 1 immediately loads all 200 real MCQs with options, Gujarati explanations, and proper answers without any 1,000-row Supabase limit.
            - 📝 **Dynamic Mock Tests (Tests 1 to 100+):** Zero hardcoded tests. Any test added via ChatGPT or SQL immediately displays across both Student and Admin apps. Dedicated Admin dialog to create Mock Test 6, 7, 8... 100 on the fly.
            - 📚 **100% Dynamic Syllabus & Topics:** Switched completely from static hardcoded files to Supabase `syllabus` and `syllabus_topics` (151 real topics). Topic-specific MCQ counts and practice sessions are dynamically queried from live database questions.
            - 🔄 **Zero Manual App Updates Required:** Supabase is now the absolute Single Source of Truth. Changes to questions, mock tests, and syllabus appear instantly in the app via pull-to-refresh without re-compiling or updating APKs.
            - 🔐 **Military-Grade Cryptographic Vault & Obfuscation:** XOR-256 encrypted credentials, salted SHA-256 admin authentication, and Flutter AOT release obfuscation.
          files: |
            build/app/outputs/flutter-apk/PSI_Mock_Test_Student_App.apk
            build/app/outputs/flutter-apk/Gujarat_Police_Student_App.apk
            build/app/outputs/flutter-apk/PSI_Mock_Test_Admin_App.apk
            build/app/outputs/flutter-apk/Gujarat_Police_Admin_App.apk
            build/app/outputs/bundle/release/PSI_Mock_Test_Student_App.aab
