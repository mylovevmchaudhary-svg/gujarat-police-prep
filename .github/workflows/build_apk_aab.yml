name: Build Release APK & AAB (Zero-Storage Quota)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK and AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Initialize Android Scaffolding
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 📱 Build Release APK
        run: flutter build apk --release

      - name: 📦 Build Release AAB (App Bundle)
        run: flutter build appbundle --release

      - name: 🚀 Publish Direct GitHub Release (Zero-Storage - Does NOT consume Actions Quota)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.5.0-latest
          name: "Gujarat Police Prep v2.5.0 Latest Release"
          body: |
            ## 👮‍♂️ Gujarat Police (Constable & PSI) Prep App
            - 📲 **Direct APK Download:** [app-release.apk](https://github.com/${{ github.repository }}/releases/download/v2.5.0-latest/app-release.apk)
            - 📦 **Play Store AAB Bundle:** [app-release.aab](https://github.com/${{ github.repository }}/releases/download/v2.5.0-latest/app-release.aab)
            - ✅ Built with Supabase integration, App Logo & Splash Screen, and dedicated Admin App.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: 🧹 Short Retention (Auto-deletes temporary artifacts in 1 day to save quota)
        uses: actions/upload-artifact@v4
        with:
          name: GujaratPolicePrep-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
