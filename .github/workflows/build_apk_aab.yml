name: Build Lean Student & Admin APKs (Zero-Storage Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Gujarat Police Student & Admin Apps
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Initialize Clean Modern Android v2 Scaffolding
        run: |
          rm -rf android
          flutter create --platforms=android .

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: ⚡ Build Student Release APK (~16MB)
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Gujarat_Police_Student_App.apk

      - name: 🎛️ Build Standalone Admin Release APK (~16MB)
        run: |
          flutter build apk --target=lib/admin_main.dart --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Gujarat_Police_Admin_App.apk

      - name: 📦 Build Release AAB (App Bundle for Play Store)
        run: |
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/Gujarat_Police_Student_App.aab

      - name: 🚀 Publish Direct GitHub Release (Zero-Storage - Does NOT consume Actions Quota)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.9.0-latest
          name: "Gujarat Police Student & Admin Apps v2.9.0"
          body: |
            ## 👮‍♂️ Gujarat Police (Constable & PSI) Prep Apps v2.9.0
            
            ### 📥 Download Android Applications:
            - 📱 **Student Mobile App (~16MB):** [Gujarat_Police_Student_App.apk](https://github.com/${{ github.repository }}/releases/download/v2.9.0-latest/Gujarat_Police_Student_App.apk)
            - 🎛️ **Dedicated Admin App (~16MB):** [Gujarat_Police_Admin_App.apk](https://github.com/${{ github.repository }}/releases/download/v2.9.0-latest/Gujarat_Police_Admin_App.apk)
            - 📦 **Play Store AAB Bundle:** [Gujarat_Police_Student_App.aab](https://github.com/${{ github.repository }}/releases/download/v2.9.0-latest/Gujarat_Police_Student_App.aab)
            
            ### ✨ What's New in v2.9.0:
            - 🚀 **Splash -> Login Flow:** Splash Screen with Police logo strictly leads to Login/Sign-up first.
            - 🔐 **Secure Admin Login:** Admin App is strictly gated with Admin Email & Password (`admin@police.gov.in` / `Police@2026`).
            - 📚 **Syllabus with MCQ Counts:** Every topic now displays exact MCQ counts (4,000+ total MCQs).
            - ⚡ **Supabase Live Synchronization:** Unified database state between Student and Admin App.
          files: |
            build/app/outputs/flutter-apk/Gujarat_Police_Student_App.apk
            build/app/outputs/flutter-apk/Gujarat_Police_Admin_App.apk
            build/app/outputs/bundle/release/Gujarat_Police_Student_App.aab
