name: Build Lean Student & Admin APKs (Zero-Storage Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PSI Mock Test Student & Admin Apps
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Initialize Clean Student App Scaffolding & Branded Icon
        run: |
          rm -rf android
          flutter create --platforms=android --org com.police.prep .
          # Copy custom Gujarat Police PSI Emblem launcher icons
          cp -rf android_branding/mipmap-* android/app/src/main/res/
          # Configure Student App Launcher Name to "PSI Mock Test"
          sed -i 's/android:label="[^"]*"/android:label="PSI Mock Test"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher_round"/g' android/app/src/main/AndroidManifest.xml

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Student App Dependencies
        run: flutter pub get

      - name: ⚡ Build PSI Mock Test Student Release APK (~16MB)
        run: |
          mkdir -p build/symbols
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/PSI_Mock_Test_Student_App.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Gujarat_Police_Student_App.apk

      - name: 📦 Build Release AAB (App Bundle for Play Store)
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/PSI_Mock_Test_Student_App.aab

      - name: 🎛️ Build Standalone Admin Release APK (~16MB)
        run: |
          cd police_admin_app
          flutter create --platforms=android --org com.police.admin .
          sed -i 's/android:label="[^"]*"/android:label="PSI Admin Console"/g' android/app/src/main/AndroidManifest.xml
          cp -rf ../android_branding/mipmap-* android/app/src/main/res/
          flutter pub get
          mkdir -p ../build/symbols
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=../build/symbols
          mkdir -p ../build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../build/app/outputs/flutter-apk/PSI_Mock_Test_Admin_App.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../build/app/outputs/flutter-apk/Gujarat_Police_Admin_App.apk
          cd ..

      - name: 🚀 Publish Direct GitHub Release (Zero-Storage - Does NOT consume Actions Quota)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v3.10.0-latest
          name: "PSI Mock Test & Admin Console v3.10.0 (Dynamic Supabase Integration - 18 Syllabus Sections, 151 Topics, 9 Tests & Auth Sync)"
          body: |
            ## 👮‍♂️ PSI Mock Test (Gujarat Police Constable & PSI Edition) - v3.10.0
            
            ### 📥 Download Android Applications:
            - 📱 **Student Mobile App (~16MB):** [PSI_Mock_Test_Student_App.apk](https://github.com/${{ github.repository }}/releases/download/v3.10.0-latest/PSI_Mock_Test_Student_App.apk)
            - 🎛️ **Dedicated Admin App (~16MB):** [PSI_Mock_Test_Admin_App.apk](https://github.com/${{ github.repository }}/releases/download/v3.10.0-latest/PSI_Mock_Test_Admin_App.apk)
            - 📦 **Play Store AAB Bundle:** [PSI_Mock_Test_Student_App.aab](https://github.com/${{ github.repository }}/releases/download/v3.10.0-latest/PSI_Mock_Test_Student_App.aab)
            
            ### 🚀 What's Fixed in v3.10.0 (Permanent Supabase Dynamic Integration):
            - 📚 **Full Dynamic Syllabus & Topics (18 Sections, 151 Topics):**
              - Constable: 8 sections, 65 topics mapped via `syllabus.id = syllabus_topics.syllabus_id`.
              - PSI / ASI: 10 sections, 86 topics mapped via `syllabus.id = syllabus_topics.syllabus_id`.
              - Preserved `title_gujarati`, `title`, `paper_part`, and `content_type`.
            - 🎯 **Topic-Level MCQ Counts & Practice:**
              - Real-time question counting grouped by `topic_id`.
              - Topic practice strictly queries `questions?topic_id=eq.$topicId`.
              - Empty topics cleanly present informative empty states without crashing.
            - 📋 **Mock Tests & Exact Counts (9 Tests):**
              - All 9 mock tests (5 Constable + 4 PSI) fetched dynamically from `mock_tests`.
              - Test 01 displays 200 MCQs; Tests 2-9 display 0 MCQs from `mock_test_questions`.
              - Test 01 loads all 200 questions in strict position order.
            - 👤 **Real Supabase Auth & Strict Error Handling:**
              - Eliminated silent local login fallback and auto-registration on wrong password.
              - Failed login attempts correctly return specific rejection messages.
              - Profiles synchronized with Supabase Auth UUID as primary key.
            - 🎛️ **Admin MCQ Management Hardening:**
              - MCQs inserted with exactly 4 options matching database check constraints.
              - Both `questions` and `mock_test_questions` inserts verified before confirming success.
            - 🎨 **Strict UI Preservation:** 100% design, colors, layout, fonts, navigation, and features preserved without alteration.
          files: |
            build/app/outputs/flutter-apk/PSI_Mock_Test_Student_App.apk
            build/app/outputs/flutter-apk/Gujarat_Police_Student_App.apk
            build/app/outputs/flutter-apk/PSI_Mock_Test_Admin_App.apk
            build/app/outputs/flutter-apk/Gujarat_Police_Admin_App.apk
            build/app/outputs/bundle/release/PSI_Mock_Test_Student_App.aab
