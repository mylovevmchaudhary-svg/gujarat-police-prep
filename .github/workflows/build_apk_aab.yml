name: Build Lean Student & Admin APKs (Zero-Storage Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PSI Mock Test Student & Admin Apps
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Initialize Clean Student App Scaffolding & Branded Icon
        run: |
          rm -rf android
          flutter create --platforms=android --org com.police.prep .
          # Copy custom Gujarat Police PSI Emblem launcher icons
          cp -rf android_branding/mipmap-* android/app/src/main/res/
          # Configure Student App Launcher Name to "PSI Mock Test"
          sed -i 's/android:label="[^"]*"/android:label="PSI Mock Test"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher_round"/g' android/app/src/main/AndroidManifest.xml

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Student App Dependencies
        run: flutter pub get

      - name: ⚡ Build PSI Mock Test Student Release APK (~16MB)
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/PSI_Mock_Test_Student_App.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Gujarat_Police_Student_App.apk

      - name: 📦 Build Release AAB (App Bundle for Play Store)
        run: |
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/PSI_Mock_Test_Student_App.aab

      - name: 🎛️ Build Standalone Admin Release APK (~16MB)
        run: |
          cd police_admin_app
          flutter create --platforms=android --org com.police.admin .
          sed -i 's/android:label="[^"]*"/android:label="PSI Admin Console"/g' android/app/src/main/AndroidManifest.xml
          cp -rf ../android_branding/mipmap-* android/app/src/main/res/
          flutter pub get
          flutter build apk --release --split-per-abi
          mkdir -p ../build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../build/app/outputs/flutter-apk/PSI_Mock_Test_Admin_App.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../build/app/outputs/flutter-apk/Gujarat_Police_Admin_App.apk
          cd ..

      - name: 🚀 Publish Direct GitHub Release (Zero-Storage - Does NOT consume Actions Quota)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v3.4.0-latest
          name: "PSI Mock Test & Admin Console v3.4.0 (Authentic Police Badge, Real Notifications & Supabase Sync)"
          body: |
            ## 👮‍♂️ PSI Mock Test (Gujarat Police Constable & PSI Edition) - v3.4.0
            
            ### 📥 Download Android Applications:
            - 📱 **Student Mobile App (~16MB):** [PSI_Mock_Test_Student_App.apk](https://github.com/${{ github.repository }}/releases/download/v3.4.0-latest/PSI_Mock_Test_Student_App.apk)
            - 🎛️ **Dedicated Admin App (~16MB):** [PSI_Mock_Test_Admin_App.apk](https://github.com/${{ github.repository }}/releases/download/v3.4.0-latest/PSI_Mock_Test_Admin_App.apk)
            - 📦 **Play Store AAB Bundle:** [PSI_Mock_Test_Student_App.aab](https://github.com/${{ github.repository }}/releases/download/v3.4.0-latest/PSI_Mock_Test_Student_App.aab)
            
            ### 🛡️ What's New in v3.4.0:
            - 🎖️ **Authentic Gujarat Police Emblem:** Regal Gold and Deep Navy Blue insignia featuring Ashoka 3-Lions crest, 8-point starburst, laurel wreath, and "સેવા સુરક્ષા શાંતિ" motto across splash screen and app icons.
            - 🗑️ **Zero Hardcoded Dummy Questions:** All sample dummy MCQs purged from tests and syllabus. 100% database driven from Supabase or Admin Console.
            - 🔔 **Mobile Notification System:** Replaced bookmark icon with real-time notification bell and unread badge. Heads-up mobile alert banners.
            - 🌐 **Direct Website & Community Launch:** Website button opens directly in browser without popup confirmation.
            - 🎛️ **Admin Social Media Links Manager:** Dedicated editor in Admin Console to save custom URLs (Website, WhatsApp, Telegram, YouTube, Instagram) dynamically synced to students.
            - 📢 **Admin Notification Broadcast:** Admin can broadcast instant notifications to all student apps.
            - 🔐 **Password-Protected Admin Console:** Login with `admin@police.gov.in` and `Police@2026`.
            - 🛡️ **Google Play Store Compliant:** Student app is 100% clean with zero admin code, zero test tokens, and hardened against security checks.
          files: |
            build/app/outputs/flutter-apk/PSI_Mock_Test_Student_App.apk
            build/app/outputs/flutter-apk/Gujarat_Police_Student_App.apk
            build/app/outputs/flutter-apk/PSI_Mock_Test_Admin_App.apk
            build/app/outputs/flutter-apk/Gujarat_Police_Admin_App.apk
            build/app/outputs/bundle/release/PSI_Mock_Test_Student_App.aab
