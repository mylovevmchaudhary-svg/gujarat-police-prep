name: Build Lightweight APK & AAB (16MB Split-ABI & Zero-Storage)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Lightweight Android APK and AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Initialize Android Scaffolding
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: ⚡ Build Lean Split-ABI Release APK (~16MB instead of 50MB)
        run: |
          mkdir -p build/debug-info
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info

      - name: 📦 Build Release AAB (App Bundle for Play Store)
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info

      - name: 🚀 Publish Direct GitHub Release (Zero-Storage - Does NOT consume Actions Quota)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.6.0-latest
          name: "Gujarat Police Prep v2.6.0 (Lightweight 16MB & Supabase Live)"
          body: |
            ## 👮‍♂️ Gujarat Police (Constable & PSI) Prep App
            - ⚡ **Lightweight APK (~16MB):** [app-arm64-v8a-release.apk](https://github.com/${{ github.repository }}/releases/download/v2.6.0-latest/app-arm64-v8a-release.apk)
            - 📦 **Play Store AAB Bundle:** [app-release.aab](https://github.com/${{ github.repository }}/releases/download/v2.6.0-latest/app-release.aab)
            - 💸 **UPI Cash Withdrawal:** Students can withdraw referral earnings via UPI!
            - 🛡️ **Security:** Obfuscated bytecode, Supabase RLS policies enforced.
            - 🎛️ **Dedicated Admin App:** Manage tests, questions, users, and approve cash withdrawals.
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: 🧹 Auto-Purge Short Retention Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GujaratPolicePrep-Lean-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 1
