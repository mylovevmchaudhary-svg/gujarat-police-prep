name: Build Release APK & AAB (Secured & Zero-Storage)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK and AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Initialize Android Scaffolding
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔒 Build Hardened & Obfuscated Release APK (Anti-Reverse Engineering)
        run: |
          mkdir -p build/debug-info
          flutter build apk --release --obfuscate --split-debug-info=build/debug-info

      - name: 🔒 Build Hardened & Obfuscated Release AAB (Anti-Reverse Engineering)
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info

      - name: 🚀 Publish Direct GitHub Release (Zero-Storage - Does NOT consume Actions Quota)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.5.0-latest
          name: "Gujarat Police Prep v2.5.0 (Secured & Hardened)"
          body: |
            ## 👮‍♂️ Gujarat Police (Constable & PSI) Prep App
            - 🛡️ **Security:** Obfuscated bytecode, Anti-tampering, Supabase RLS enforced.
            - 📲 **Direct APK Download:** [app-release.apk](https://github.com/${{ github.repository }}/releases/download/v2.5.0-latest/app-release.apk)
            - 📦 **Play Store AAB Bundle:** [app-release.aab](https://github.com/${{ github.repository }}/releases/download/v2.5.0-latest/app-release.aab)
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: 🧹 Auto-Purge Short Retention Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GujaratPolicePrep-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
